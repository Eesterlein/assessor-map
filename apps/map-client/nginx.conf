server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # MapLibre 6 loads its tile worker as an ES module (.mjs). nginx's default
    # mime.types has no entry for .mjs, and browsers refuse to run a module
    # script served as application/octet-stream, which leaves the map blank.
    # (Regex locations win over the /assets/ prefix below, so .mjs lands here.)
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vite puts a content hash in every built file name, so these never change
    # under the same name and can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must be re-checked on every visit. Otherwise browsers keep
    # an old index.html that points at assets a new deploy has replaced, and
    # the page loads blank until a hard refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
