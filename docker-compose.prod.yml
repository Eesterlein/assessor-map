# Production overrides. Use alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Set these in .env on the server (never commit .env):
#   SESSION_SECRET  — run: openssl rand -hex 32
#   CORS_ORIGINS    — e.g. http://1.2.3.4  (your VPS IP)
#   ADMIN_USERNAME  — e.g. admin
#   ADMIN_PASSWORD_HASH — bcrypt hash, see deployment notes
#
# The public demo runs with smaller upload limits, and only the gateway is
# published. Internal services stay on the Docker network so they can't be
# reached around nginx. `!reset` needs Docker Compose 2.24.4 or newer.

services:
  # restart: unless-stopped brings services back after a crash (e.g. the
  # kernel's out-of-memory killer) or a server reboot.
  postgis:
    restart: unless-stopped

  gateway:
    restart: unless-stopped
    # !override replaces the base file's 8000:8000 instead of adding to it,
    # so the gateway is published on port 80 only.
    ports: !override
      - "80:8000"

  admin-app:
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      MAX_UPLOAD_MB: "25"
    ports: !reset []

  ingest:
    restart: unless-stopped
    environment:
      INGEST_MAX_MB: "25"
    ports: !reset []

  tipg:
    restart: unless-stopped
    ports: !reset []

  map-client:
    restart: unless-stopped
    ports: !reset []
