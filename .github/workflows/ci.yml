name: CI

on:
  pull_request:
    branches: [main, ai/main]
  push:
    branches: [ai/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Run lib tests with coverage so vitest enforces the threshold values in vitest.config.ts
      - run: pnpm test:coverage
        working-directory: packages/map-ui-lib
      # App + sidecar suites aren't part of `pnpm test` (lib only) — run them here.
      - name: map-client tests
        run: cd apps/map-client && pnpm exec vitest run
      - name: admin-app tests
        run: cd apps/admin-app && pnpm exec vitest run --coverage
      - name: ingest-service unit tests
        run: pnpm --filter ingest-service test

  ingest-integration:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
        env:
          POSTGRES_DB: gis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install GDAL (ogr2ogr/ogrinfo)
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: pnpm install --frozen-lockfile
      - name: ingest-service integration (real ogr2ogr + PostGIS)
        run: cd apps/ingest-service && pnpm exec vitest run src/ingest.integration.test.ts
        env:
          INGEST_INTEGRATION: "1"
          INGEST_DB_HOST: localhost
          INGEST_DB_PORT: "5432"
          INGEST_DB_NAME: gis
          INGEST_DB_USER: postgres
          INGEST_DB_PASSWORD: postgres
